# Prometheus Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: engineering-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.45.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-storage
              mountPath: /prometheus
      volumes:
        - name: prometheus-storage
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: engineering-os
spec:
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: prometheus

---
# Grafana Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: engineering-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.0.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "PROD_GRAFANA_ADMIN_PASSWORD_99"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: engineering-os
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: grafana

---
# Grafana Loki Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: engineering-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.8.2
          ports:
            - containerPort: 3100
---
apiVersion: v1
kind: Service
metadata:
  name: loki-service
  namespace: engineering-os
spec:
  ports:
    - port: 3100
      targetPort: 3100
  selector:
    app: loki
