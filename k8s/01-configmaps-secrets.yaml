apiVersion: v1
kind: ConfigMap
metadata:
  name: engineering-os-config
  namespace: engineering-os
data:
  ENVIRONMENT: "production"
  POSTGRES_SERVER: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "engineering_os_auth"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  NEO4J_URI: "bolt://neo4j-service:7687"
  OPENAI_MODEL: "gpt-4o"
  LOG_LEVEL: "INFO"

---
apiVersion: v1
kind: Secret
metadata:
  name: engineering-os-secrets
  namespace: engineering-os
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "PROD_SECURE_POSTGRES_PASSWORD_9876"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "PROD_SECURE_NEO4J_PASSWORD_1234"
  JWT_SECRET_KEY: "PROD_SUPER_SECRET_JWT_KEY_99887766"
  JWT_REFRESH_SECRET_KEY: "PROD_SUPER_SECRET_REFRESH_KEY_11223344"
  OPENAI_API_KEY: "sk-proj-prod-openai-key-placeholder"
  GITHUB_CLIENT_SECRET: "gh_secret_placeholder"
