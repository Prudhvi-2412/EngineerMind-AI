apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: engineering-os-ingress
  namespace: engineering-os
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - engineeringos.company.com
      secretName: engineeringos-tls-cert
  rules:
    - host: engineeringos.company.com
      http:
        paths:
          # API Backend & Monitoring endpoints
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /health/readiness
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 8000

          # Next.js Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
