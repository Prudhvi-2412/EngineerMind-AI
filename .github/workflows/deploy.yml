name: Production CI/CD Build & Kubernetes Deployment Pipeline

on:
  push:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend
  NGINX_IMAGE_NAME: ${{ github.repository }}/nginx

jobs:
  # ========================================================
  # JOB 1: Lint, Unit Tests & Coverage
  # ========================================================
  test:
    name: 🧪 Lint & Unit Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Run Pytest
        env:
          PYTHONPATH: .
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install -r requirements.txt
          python -m pytest tests/unit/

  # ========================================================
  # JOB 2: Vulnerability & Container Security Scanning
  # ========================================================
  security:
    name: 🛡️ Security & Vulnerability Scan
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'

  # ========================================================
  # JOB 3: Multi-Stage Production Docker Build & Push
  # ========================================================
  build-and-push:
    name: 🐳 Docker Multi-Stage Build & Push
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/backend:latest

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/frontend:latest

      - name: Build & Push Nginx Container
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/nginx:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/nginx:latest

  # ========================================================
  # JOB 4: Kubernetes Rolling Deployment
  # ========================================================
  deploy:
    name: 🚀 Deploy to Production Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-configmaps-secrets.yaml
          kubectl apply -f k8s/02-storage.yaml
          kubectl apply -f k8s/03-databases.yaml
          kubectl apply -f k8s/04-apps.yaml
          kubectl apply -f k8s/05-monitoring.yaml
          kubectl apply -f k8s/06-ingress.yaml
          kubectl apply -f k8s/07-hpa.yaml

      - name: Verify Backend Rollout
        run: |
          kubectl rollout status deployment/backend -n engineering-os --timeout=180s

      - name: Verify Frontend Rollout
        run: |
          kubectl rollout status deployment/frontend -n engineering-os --timeout=180s

  # ========================================================
  # JOB 5: Automated Rollback on Deployment Failure
  # ========================================================
  rollback:
    name: ⏪ Automated Rollback on Failure
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Rollback Kubernetes Deployments
        run: |
          echo "⚠️ Deployment failed! Triggering automatic Kubernetes rollback..."
          kubectl rollout undo deployment/backend -n engineering-os
          kubectl rollout undo deployment/frontend -n engineering-os
          kubectl rollout status deployment/backend -n engineering-os

  # ========================================================
  # JOB 6: Multi-Channel Pipeline Notifications
  # ========================================================
  notify:
    name: 📢 Pipeline Dispatch Notifications
    needs: [deploy, rollback]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Slack & Multi-Channel Notification
        run: |
          echo "📢 Pipeline execution finished with status: ${{ job.status }}"
