name: PR Quality Gate & Security Check

on:
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-test:
    name: 🧪 Linting & Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio pytest-cov bandit
          pip install -r requirements.txt

      - name: Run Python Linting & SAST Scan
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
          bandit -r app/ -q || true

      - name: Run Backend Unit Tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/unit/ --cov=app --cov-report=term-missing

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "frontend/package*.json"

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
